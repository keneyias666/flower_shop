<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>For You, With Love</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Satisfy&family=Caveat:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap"
    rel="stylesheet">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="text/javascript">
    (function () {
      // TODO: Replace with your actual Public Key from Account -> API Keys
      emailjs.init("fIatUKWorlZ2MP7GA");
    })();
  </script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --cream: #f2ede4;
      --ink: #1e1a17;
      --ink-light: #5a4f47;
      --ink-faint: #9a8f87;
      --paper: #faf8f4;
      --border: rgba(30, 26, 23, 0.14);
      --border-mid: rgba(30, 26, 23, 0.28);
      --rose: #c97b7b;
    }

    html,
    body {
      width: 100%;
      min-height: 100vh;
      background: var(--cream);
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: var(--ink);
      overflow-x: hidden;
    }

    /* SCREENS */
    .screen {
      display: none;
      min-height: 100vh;
      width: 100%
    }

    .screen.active {
      display: flex;
      flex-direction: column
    }

    /* ── MUSIC PILL ── */
    #music-pill {
      position: fixed;
      bottom: clamp(12px, 3vw, 18px);
      right: clamp(12px, 3vw, 18px);
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(250, 248, 244, 0.93);
      border: 0.8px solid var(--border-mid);
      border-radius: 40px;
      padding: 7px 14px 7px 8px;
      box-shadow: 0 2px 14px rgba(30, 26, 23, 0.13);
      backdrop-filter: blur(8px);
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      user-select: none;
    }

    #music-pill:hover {
      background: rgba(242, 237, 228, 0.98);
      transform: translateY(-1px)
    }

    #music-pill:active {
      transform: scale(0.97)
    }

    .pill-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border-mid);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.2s;
    }

    #music-pill.playing .pill-icon {
      border-color: var(--rose)
    }

    .pill-label {
      font-family: 'Caveat', cursive;
      font-size: clamp(11px, 3vw, 13px);
      color: var(--ink-faint);
      white-space: nowrap;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #music-pill.playing .pill-label {
      color: var(--ink-light)
    }

    /* ── BARS ANIMATION ── */
    .bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px
    }

    .bar {
      width: 3px;
      border-radius: 2px;
      background: var(--ink-faint);
      transition: background 0.2s;
    }

    #music-pill.playing .bar {
      background: var(--rose)
    }

    .bar:nth-child(1) {
      height: 6px
    }

    .bar:nth-child(2) {
      height: 11px
    }

    .bar:nth-child(3) {
      height: 8px
    }

    .bar:nth-child(4) {
      height: 13px
    }

    .bar:nth-child(5) {
      height: 5px
    }

    #music-pill.playing .bar:nth-child(1) {
      animation: bar-bounce 0.7s 0.0s ease-in-out infinite alternate
    }

    #music-pill.playing .bar:nth-child(2) {
      animation: bar-bounce 0.7s 0.1s ease-in-out infinite alternate
    }

    #music-pill.playing .bar:nth-child(3) {
      animation: bar-bounce 0.7s 0.2s ease-in-out infinite alternate
    }

    #music-pill.playing .bar:nth-child(4) {
      animation: bar-bounce 0.7s 0.15s ease-in-out infinite alternate
    }

    #music-pill.playing .bar:nth-child(5) {
      animation: bar-bounce 0.7s 0.05s ease-in-out infinite alternate
    }

    @keyframes bar-bounce {
      from {
        transform: scaleY(0.3)
      }

      to {
        transform: scaleY(1)
      }
    }

    /* ============================================================
   SCREEN 1 — INTRO
   ============================================================ */
    #screen-intro {
      background: var(--cream);
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px 80px;
    }

    .bike-hero-wrap {
      cursor: pointer;
      display: inline-block;
      margin-bottom: clamp(28px, 8vw, 48px);
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(1px 3px 6px rgba(30, 26, 23, 0.13));
    }

    .bike-hero-wrap:hover {
      transform: translateY(-5px)
    }

    .bike-hero-wrap:active {
      transform: scale(0.97)
    }

    .intro-title {
      font-family: 'Satisfy', cursive;
      font-size: clamp(22px, 6vw, 34px);
      color: var(--ink);
      letter-spacing: 0.3px;
      margin-bottom: 8px;
    }

    .intro-hint {
      font-family: 'Caveat', cursive;
      font-size: clamp(13px, 3.5vw, 16px);
      color: var(--ink-faint);
      animation: hint-pulse 2.5s ease-in-out infinite;
    }

    @keyframes hint-pulse {

      0%,
      100% {
        opacity: 0.35
      }

      55% {
        opacity: 0.85
      }
    }

    /* ============================================================
   SCREEN 2 — RIDING
   ============================================================ */
    #screen-flying {
      background: var(--cream);
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .riding-stage {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      width: 100%;
      max-width: 680px;
      padding: 0 clamp(16px, 4vw, 40px);
    }

    .bike-ride-wrap {
      position: relative;
      z-index: 10;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.5s, transform 0.5s;
    }

    .bike-ride-wrap.riding {
      animation: bike-ride 5.5s ease-in-out forwards
    }

    @keyframes bike-ride {
      0% {
        transform: translateX(0);
        opacity: 1
      }

      55% {
        transform: translateX(clamp(-10px, -2vw, -30px));
        opacity: 1
      }

      100% {
        transform: translateX(clamp(-110px, -25vw, -200px));
        opacity: 1
      }
    }

    .bike-ride-svg {
      width: clamp(140px, 28vw, 200px)
    }

    .ride-caption {
      font-family: 'Caveat', cursive;
      font-size: clamp(13px, 3.5vw, 16px);
      color: var(--ink-faint);
      margin-top: 14px;
      animation: hint-pulse 2s ease-in-out infinite;
    }

    .shop-ease {
      position: absolute;
      right: -340px;
      opacity: 0;
      transition: right 1.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.9s ease-out;
      cursor: pointer;
      z-index: 8;
      flex-shrink: 0;
    }

    .shop-ease.in {
      right: clamp(12px, 6vw, 60px);
      opacity: 1
    }

    .shop-ease-svg {
      width: clamp(130px, 22vw, 180px)
    }

    .shop-tap {
      font-family: 'Caveat', cursive;
      font-size: clamp(11px, 3vw, 13px);
      color: var(--ink-faint);
      text-align: center;
      margin-top: 8px;
      animation: hint-pulse 2s ease-in-out infinite;
      opacity: 0;
      transition: opacity 0.6s;
    }

    .shop-ease.in .shop-tap {
      opacity: 1
    }

    .wspin {
      animation: wspin 0.65s linear infinite;
      transform-origin: center
    }

    @keyframes wspin {
      to {
        transform: rotate(360deg)
      }
    }

    /* ============================================================
   SCREEN 3 — SHOP INTERIOR
   ============================================================ */
    #screen-shop {
      background: var(--cream);
      padding: 0 0 80px;
      align-items: stretch;
    }

    .shop-header {
      text-align: center;
      padding: clamp(18px, 4vw, 28px) 20px clamp(12px, 3vw, 16px);
      border-bottom: 0.5px solid var(--border);
    }

    .shop-title {
      font-family: 'Satisfy', cursive;
      font-size: clamp(22px, 6vw, 32px);
      color: var(--ink);
      margin-bottom: 4px
    }

    .shop-sub {
      font-family: 'Caveat', cursive;
      font-size: clamp(12px, 3vw, 14px);
      color: var(--ink-faint)
    }

    .shelf-section {
      padding: 0 0 4px
    }

    .shelf-label {
      font-family: 'Caveat', cursive;
      font-size: clamp(11px, 3vw, 13px);
      color: var(--ink-faint);
      padding: 18px 18px 4px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .shelf-unit {
      padding: 14px clamp(6px, 2vw, 14px) 0;
      overflow-x: auto;
      scrollbar-width: none
    }

    .shelf-unit::-webkit-scrollbar {
      display: none
    }

    .shelf-plank {
      display: flex;
      gap: clamp(6px, 1.5vw, 14px);
      justify-content: center;
      flex-wrap: wrap
    }

    .shelf-board {
      width: 100%;
      height: 14px;
      margin-top: 2px;
      background: linear-gradient(180deg, #c4a882, #a8896a 55%, #9a7a5a);
      border-radius: 3px;
      box-shadow: 0 4px 12px rgba(80, 40, 10, 0.22), inset 0 1px 0 rgba(255, 220, 150, 0.25);
    }

    .flower-vase {
      flex: 0 0 auto;
      width: clamp(80px, 13vw, 110px);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      padding: clamp(8px, 2vw, 12px) 8px 0;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .flower-vase:hover {
      transform: translateY(-9px) scale(1.06)
    }

    .flower-vase:active {
      transform: scale(0.97)
    }

    .vase-name {
      font-family: 'Caveat', cursive;
      font-size: clamp(10px, 2.8vw, 13px);
      color: var(--ink);
      font-weight: 600;
      margin-top: 5px;
      text-align: center;
    }

    .vase-tag {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(8px, 2.2vw, 10px);
      color: var(--ink-faint);
      font-style: italic;
      text-align: center;
      margin-top: 1px;
      max-width: 88px;
      line-height: 1.3;
    }

    /* ============================================================
   SCREEN 4 — LETTER  (VERTICAL LAYOUT — full width notepaper)
   ============================================================ */
    #screen-message {
      background: var(--cream);
      align-items: center;
      justify-content: flex-start;
      padding: clamp(56px, 10vw, 80px) clamp(12px, 5vw, 28px) clamp(30px, 6vw, 50px);
      min-height: 100vh;
    }

    .back-btn {
      position: fixed;
      top: clamp(10px, 3vw, 14px);
      left: clamp(10px, 3vw, 14px);
      font-family: 'Caveat', cursive;
      font-size: clamp(13px, 3.5vw, 15px);
      color: var(--ink-light);
      background: rgba(242, 237, 228, 0.92);
      border: none;
      cursor: pointer;
      padding: 5px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 4px;
      z-index: 200;
      transition: color 0.2s;
      backdrop-filter: blur(4px);
    }

    .back-btn:hover {
      color: var(--ink)
    }

    /* FULL-WIDTH VERTICAL LETTER LAYOUT */
    .letter-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(10px, 2vw, 18px);
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
    }

    /* BOUQUET TOP — centered above the note */
    .letter-bouquet-side {
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      justify-content: center;
      gap: clamp(6px, 2vw, 14px);
      transform: translateY(-12px);
      opacity: 0;
      transition: transform 0.6s 0.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s 0.2s;
      flex-shrink: 0;
    }

    .letter-bouquet-side.show {
      transform: translateY(0);
      opacity: 1
    }

    .bouquet-wrap-div {
      width: clamp(44px, 10vw, 58px);
      background: linear-gradient(160deg, #f0e4d0, #e0d0bc, #d0c0ac);
      border-radius: 3px 3px 8px 8px;
      padding: clamp(4px, 1vw, 6px) clamp(6px, 1.5vw, 9px) clamp(6px, 1.5vw, 9px);
      position: relative;
      box-shadow: 0 3px 10px rgba(80, 40, 10, 0.15);
    }

    .bouquet-wrap-div::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: clamp(14px, 3.5vw, 20px);
      height: clamp(6px, 1.2vw, 8px);
      background: var(--rose);
      border-radius: 0 0 3px 3px;
    }

    /* NOTEPAPER — full width, vertical */
    .notepaper {
      width: 100%;
      background: #faf8f3;
      border: 1px solid rgba(30, 26, 23, 0.13);
      border-radius: 2px;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.8) inset,
        0 6px 30px rgba(30, 26, 23, 0.1),
        2px 3px 0 rgba(30, 26, 23, 0.04);
      position: relative;
      overflow: hidden;
      background-image: repeating-linear-gradient(transparent,
          transparent calc(1.85em - 1px),
          rgba(180, 140, 140, 0.14) calc(1.85em - 1px),
          rgba(180, 140, 140, 0.14) 1.85em);
      background-size: 100% 1.85em;
      padding: clamp(16px, 4vw, 28px) clamp(16px, 4vw, 24px) clamp(18px, 4vw, 26px) clamp(22px, 5vw, 32px);
    }

    .notepaper::before {
      content: '';
      position: absolute;
      top: 0;
      left: clamp(16px, 4.5vw, 26px);
      bottom: 0;
      width: 1px;
      background: rgba(201, 100, 100, 0.18);
    }

    .notepaper::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: repeating-linear-gradient(90deg,
          var(--cream) 0px, var(--cream) 4px,
          rgba(30, 26, 23, 0.06) 4px, rgba(30, 26, 23, 0.06) 5px);
    }

    .hole {
      position: absolute;
      left: clamp(5px, 1.5vw, 8px);
      width: clamp(7px, 1.8vw, 9px);
      height: clamp(7px, 1.8vw, 9px);
      border-radius: 50%;
      background: var(--cream);
      border: 0.8px solid rgba(30, 26, 23, 0.15);
      box-shadow: inset 0 1px 2px rgba(30, 26, 23, 0.1);
    }

    .note-salutation {
      font-family: 'Satisfy', cursive;
      font-size: clamp(18px, 5vw, 24px);
      color: var(--ink);
      margin-bottom: clamp(10px, 2.5vw, 16px);
      padding-left: clamp(10px, 3vw, 16px);
      line-height: 1.85;
    }

    .note-body {
      font-family: 'Caveat', cursive;
      font-size: clamp(14px, 4vw, 17px);
      color: var(--ink-light);
      line-height: 1.85;
      white-space: pre-wrap;
      padding-left: clamp(10px, 3vw, 16px);
    }

    .note-sign {
      font-family: 'Satisfy', cursive;
      font-size: clamp(15px, 4.5vw, 20px);
      color: var(--ink);
      text-align: right;
      margin-top: clamp(12px, 3vw, 18px);
      padding-right: 4px;
    }

    .note-heart-row {
      text-align: center;
      margin-top: clamp(12px, 3vw, 18px)
    }

    .heart-btn {
      background: none;
      border: 1px solid var(--border-mid);
      border-radius: 50%;
      width: clamp(38px, 10vw, 46px);
      height: clamp(38px, 10vw, 46px);
      cursor: pointer;
      transition: all 0.25s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .heart-btn:hover {
      background: rgba(201, 123, 123, 0.09);
      transform: scale(1.1)
    }

    .heart-btn.liked svg path {
      fill: var(--rose);
      stroke: var(--rose)
    }

    /* ============================================================
   SCREEN 5 — THANK YOU
   ============================================================ */
    #screen-thankyou {
      background: var(--cream);
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(40px, 10vw, 70px) 24px;
      min-height: 100vh;
    }

    #ty-flower-wrap {
      width: clamp(80px, 20vw, 110px);
      margin: 0 auto clamp(16px, 4vw, 24px)
    }

    .ty-title {
      font-family: 'Satisfy', cursive;
      font-size: clamp(22px, 7vw, 38px);
      color: var(--ink);
      margin-bottom: 10px
    }

    .ty-note {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(14px, 4vw, 17px);
      color: var(--ink-light);
      font-style: italic;
      max-width: 300px;
      line-height: 1.7;
      margin: 0 auto clamp(24px, 6vw, 36px);
    }

    .restart-btn {
      font-family: 'Caveat', cursive;
      font-size: clamp(13px, 3.5vw, 14px);
      color: var(--ink-faint);
      background: none;
      border: 0.5px dashed var(--border-mid);
      padding: 8px 22px;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .restart-btn:hover {
      color: var(--ink);
      border-color: var(--ink)
    }

    .fade-in {
      animation: fadeIn 0.6s ease both
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @media(min-width:600px) {
      .flower-vase {
        width: 105px
      }

      .shelf-plank {
        gap: 16px
      }
    }

    @media(min-width:900px) {
      .flower-vase {
        width: 118px
      }

      .shelf-plank {
        gap: 20px;
        padding: 0 24px
      }
    }
  </style>
</head>

<body>

  <!-- AUDIO -->
  <audio id="bg-audio"></audio>

  <!-- MUSIC PILL -->
  <div id="music-pill" onclick="toggleMusic()">
    <div class="pill-icon">
      <div class="bars">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>
    <span class="pill-label">Libu-Libong Buwan</span>
  </div>

  <!-- ============ SCREEN 1: INTRO ============ -->
  <div class="screen active" id="screen-intro">
    <div class="bike-hero-wrap" id="bike-hero-click">
      <svg viewBox="0 0 300 210" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:clamp(200px,55vw,280px)">
        <!-- shadow -->
        <ellipse cx="150" cy="202" rx="108" ry="5" fill="rgba(30,26,23,0.07)" />

        <!-- KICKSTAND (deployed, bike parked) -->
        <line x1="128" y1="148" x2="110" y2="192" stroke="#1e1a17" stroke-width="2" stroke-linecap="round" />
        <line x1="110" y1="192" x2="118" y2="194" stroke="#1e1a17" stroke-width="1.5" stroke-linecap="round" />

        <!-- rear wheel -->
        <circle cx="75" cy="148" r="40" fill="none" stroke="#1e1a17" stroke-width="2.2" />
        <g style="transform-origin:75px 148px">
          <line x1="75" y1="108" x2="75" y2="188" stroke="#1e1a17" stroke-width="0.9" />
          <line x1="35" y1="148" x2="115" y2="148" stroke="#1e1a17" stroke-width="0.9" />
          <line x1="47" y1="120" x2="103" y2="176" stroke="#1e1a17" stroke-width="0.9" />
          <line x1="103" y1="120" x2="47" y2="176" stroke="#1e1a17" stroke-width="0.9" />
          <line x1="51" y1="112" x2="99" y2="184" stroke="#1e1a17" stroke-width="0.55" opacity="0.45" />
          <line x1="99" y1="112" x2="51" y2="184" stroke="#1e1a17" stroke-width="0.55" opacity="0.45" />
        </g>
        <circle cx="75" cy="148" r="5" fill="#1e1a17" />

        <!-- front wheel -->
        <circle cx="225" cy="148" r="40" fill="none" stroke="#1e1a17" stroke-width="2.2" />
        <g style="transform-origin:225px 148px">
          <line x1="225" y1="108" x2="225" y2="188" stroke="#1e1a17" stroke-width="0.9" />
          <line x1="185" y1="148" x2="265" y2="148" stroke="#1e1a17" stroke-width="0.9" />
          <line x1="197" y1="120" x2="253" y2="176" stroke="#1e1a17" stroke-width="0.9" />
          <line x1="253" y1="120" x2="197" y2="176" stroke="#1e1a17" stroke-width="0.9" />
          <line x1="201" y1="112" x2="249" y2="184" stroke="#1e1a17" stroke-width="0.55" opacity="0.45" />
          <line x1="249" y1="112" x2="201" y2="184" stroke="#1e1a17" stroke-width="0.55" opacity="0.45" />
        </g>
        <circle cx="225" cy="148" r="5" fill="#1e1a17" />

        <!-- frame diamond -->

    // ── AUDIO PLAYLIST ──

    const playlist = [
      'song_libu_libong_buwan.mp3',
      'habang_buhay_song.mp3'
    ];
    let currentSongIndex = 0;
    
    audio.src = playlist[currentSongIndex];
    audio.volume = 0.42;
    let audioPlaying = false;

    const pill = document.getElementById('music-pill');
    const pillLabel = document.querySelector('.pill-label');

    audio.addEventListener('ended', () => {
      currentSongIndex = (currentSongIndex + 1) % playlist.length;
      audio.src = playlist[currentSongIndex];
      
      if (currentSongIndex === 0) {
        pillLabel.textContent = 'Libu-Libong Buwan';
      } else {
        pillLabel.textContent = 'Habang Buhay';
      }

      audio.play().catch(() => {});
    });

    function toggleMusic() {
      if (audioPlaying) {
        audio.pause();
        audioPlaying = false;
        pill.classList.remove('playing');
      } else {
        audio.play().then(() => {
          audioPlaying = true;
          pill.classList.add('playing');
        }).catch(() => { });
      }
    }

    function tryPlayAudio() {
      if (!audioPlaying) {
        audio.play().then(() => {
          audioPlaying = true;
          pill.classList.add('playing');
        }).catch(() => { });

    function flowerSVG(f, w = 68, h = 76) {
      return `<svg viewBox="0 0 72 80" width="${w}" height="${h}" fill="none">${f.draw(f.stroke)}</svg>`;
    }
    function bouquetSVG(f, w = 72, h = 88) {
      return `<svg viewBox="0 0 90 100" width="${w}" height="${h}" fill="none">
    <g transform="rotate(-14,45,90) translate(-6,0)">${f.draw(f.stroke)}</g>
    <g transform="translate(0,0)">${f.draw(f.stroke)}</g>
    <g transform="rotate(14,45,90) translate(6,0)">${f.draw(f.stroke)}</g>
  </svg>`;
    }
    function vaseSVG(f) {
      return `<svg viewBox="0 0 72 100" fill="none" width="72" height="100">
    <g transform="translate(0,-8)">${f.draw(f.stroke)}</g>
    <path d="M20 66 Q16 72 18 82 Q20 91 36 93 Q52 91 54 82 Q56 72 52 66Z"
          fill="${f.color}" stroke="#1e1a17" stroke-width="1.4" opacity="0.88"/>
    <path d="M20 66 Q22 62 36 61 Q50 62 52 66"
          fill="${f.color}" stroke="#1e1a17" stroke-width="1.2"/>
    <path d="M22 70 Q36 72 50 70" stroke="rgba(100,160,200,0.25)" stroke-width="1" fill="none"/>
    <path d="M24 68 Q26 75 25 83" stroke="rgba(255,255,255,0.35)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </svg>`;
    }

    // BUILD SHELVES
    function buildShelves() {
      const container = document.getElementById('shelves-container');
      const groups = {};
      FLOWERS.forEach(f => { if (!groups[f.shelf]) groups[f.shelf] = []; groups[f.shelf].push(f); });
      Object.entries(groups).forEach(([label, flowers]) => {
        const sec = document.createElement('div');
        sec.className = 'shelf-section';
        const lbl = document.createElement('div');
        lbl.className = 'shelf-label';
        lbl.textContent = label;
        sec.appendChild(lbl);
        const unit = document.createElement('div');
        unit.className = 'shelf-unit';
        const plank = document.createElement('div');
        plank.className = 'shelf-plank';
        flowers.forEach(f => {
          const v = document.createElement('div');
          v.className = 'flower-vase';
          v.innerHTML = `${vaseSVG(f)}<div class="vase-name">${f.name}</div><div class="vase-tag">${f.meaning}</div>`;
          v.addEventListener('click', () => pickFlower(f));
          plank.appendChild(v);
        });
        unit.appendChild(plank);
        const board = document.createElement('div');
        board.className = 'shelf-board';
        unit.appendChild(board);
        sec.appendChild(unit);
        container.appendChild(sec);
      });
    }
    buildShelves();

    // SCREEN NAV
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      window.scrollTo(0, 0);
    }

    // BIKE CLICK
    let shopReady = false;
    document.getElementById('bike-hero-click').addEventListener('click', () => {
      tryPlayAudio();
      showScreen('screen-flying');
      startRiding();
    });

    function startRiding() {
      shopReady = false;
      const bikeWrap = document.getElementById('bike-ride');
      const caption = document.getElementById('ride-caption');
      const shop = document.getElementById('shop-facade');
      bikeWrap.classList.remove('riding');
      bikeWrap.style.opacity = '1';
      shop.classList.remove('in');
      void bikeWrap.offsetWidth;
      document.querySelectorAll('.wspin').forEach(el => el.style.animationPlayState = 'running');
      bikeWrap.classList.add('riding');
      setTimeout(() => { shop.classList.add('in'); }, 2500);
      setTimeout(() => {
        caption.style.display = 'none';
        document.querySelectorAll('.wspin').forEach(el => el.style.animationPlayState = 'paused');
        shopReady = true;
      }, 5400);
    }

    function enterShop() {
      if (!shopReady) return;
      showScreen('screen-shop');
    }

    // PICK FLOWER
    let currentFlower = null;

    function pickFlower(f) {
      currentFlower = f;
      document.getElementById('note-salutation').textContent = f.salutation || 'My darling,';
      document.getElementById('note-body').textContent = f.message;
      document.getElementById('note-sign').textContent = f.sign || 'With love ♡';
      document.getElementById('bouquet-svg-wrap').innerHTML = flowerSVG(f, 80, 96);
      document.getElementById('heart-btn').classList.remove('liked');
      document.getElementById('ty-flower-wrap').innerHTML = flowerSVG(f, 100, 112);
      document.getElementById('ty-note').textContent = `She chose ${f.name} — ${f.meaning}. Every word was meant for her.`;

      // Hide bouquet wrapper element to display just the flower
      const wrapDiv = document.getElementById('bouquet-wrap-div');
      if (wrapDiv) wrapDiv.style.display = 'none';

      showScreen('screen-message');
      const side = document.getElementById('letter-bouquet-side');
      side.classList.remove('show');
      void side.offsetWidth; // Trigger reflow
      requestAnimationFrame(() => side.classList.add('show'));
    }

    document.getElementById('back-btn').addEventListener('click', () => showScreen('screen-shop'));
    document.getElementById('heart-btn').addEventListener('click', function () {
      this.classList.add('liked');

      if (currentFlower) {
        const flowerEmojis = {
          'white-lily': '🤍🌸',
          'lavender': '🪻',
          'sunflower': '🌻',
          'pink-camellia': '🌺',
          'blue-iris': '💙🌸',
          'daisy': '🌼',
          'red-tulip': '🌷',
          'white-rose': '🤍🌹',
          'peach-blossom': '🌸',
          'forget-me-not': '🩵🌸'
        };
        const flowerEmoji = flowerEmojis[currentFlower.id] || '🌸';

        const templateParams = {
          flower_name: currentFlower.name,
          flower_meaning: currentFlower.meaning,
          salutation: currentFlower.salutation || 'My darling,',
          message: currentFlower.message,
          sign: currentFlower.sign || 'With love 🍊',
          to_email: 'gabrilloaika05@gmail.com',
          reply_to: 'keneyias666@gmail.com',
          flower_emoji: flowerEmoji
        };

        // TODO: Replace with your actual Service ID and Template ID
        emailjs.send("service_dxzxir9", "template_lgo9jy5", templateParams)
          .then(function (response) {
            console.log('Email successfully sent!', response.status, response.text);
          }, function (error) {
            console.error('Email failed to send...', error);
          });
      }

      setTimeout(() => showScreen('screen-thankyou'), 600);
    });
    document.getElementById('restart-btn').addEventListener('click', () => {
      const bw = document.getElementById('bike-ride');
      bw.classList.remove('riding');
      bw.style.opacity = '1';
      document.getElementById('ride-caption').style.display = '';
      showScreen('screen-intro');
    });
  </script>
